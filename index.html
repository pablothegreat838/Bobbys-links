<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171a18">
  <meta name="description" content="A hand-picked collection of Bobby's most useful links, updated daily.">
  <title>Home | Bobby's Links</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body data-page="home">
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Bobby's Links home"><span class="wordmark-mark" aria-hidden="true">b.</span><span>Bobby's <span class="wordmark-light">Links</span></span></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a class="nav-link is-active" href="/" aria-current="page">Home</a>
      <a class="nav-link" href="/links">Links</a>
    </nav>
    <span class="header-note"><span class="status-dot" aria-hidden="true"></span>Updated daily</span>
  </header>

  <main class="page-shell">
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">Welcome to <span>Bobby's Links</span></h1>
    </section>

    <section id="announcements" class="announcements" aria-label="Announcements" hidden></section>

    <section class="content-section" aria-labelledby="featured-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Your daily starting point</p>
          <h2 id="featured-title">Featured links</h2>
        </div>
        <a class="text-link" href="/links">All links <span aria-hidden="true">↗</span></a>
      </div>
      <div id="featured-links" class="link-grid" aria-live="polite"></div>
    </section>
    <footer class="site-footer"><span>Bobby's Links</span><span>Just the good stuff.</span></footer>
  </main>
</body>
</html>
